<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · CATI Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css//style.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body class="auth">
<main class="auth__box card">
  <h1>Criar conta</h1>
  <p class="muted">Escolha um usuário único e uma senha.</p>
  <div id="msg" class="alert alert--erro" role="alert" hidden></div>
  <form id="form-cadastro" novalidate>
    <label class="field"><span>Usuário</span><input id="input-username" type="text" name="username" autocomplete="username" required></label>
    <label class="field"><span>Senha</span><input id="input-pass" type="password" name="senha" autocomplete="new-password" required></label>
    <button class="btn btn-dark btn-block" type="submit">Criar conta</button>
  </form>
  <p class="muted" style="margin:1rem 0 0">Já tem conta? <a href="login.html">Entrar</a></p>
</main>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cadastro.js"></script>
</body>
</html>
